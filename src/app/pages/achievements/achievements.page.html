<ion-content [fullscreen]="true">
  <main class="page">
    <div class="shell">
      <header class="topbar">
        <button class="icon-btn" (click)="go('/home')"><ion-icon name="arrow-back"></ion-icon></button>
        <div class="title">{{'achievements.title' | translate}}</div>
        <div class="pill">{{unlockedCount}} / {{items.length}}</div>
      </header>
      <p class="subtitle">{{'achievements.subtitle' | translate}}</p>
      <section class="ach-list">
        <article *ngFor="let a of items; trackBy: trackByKey" class="card achievement" [class.locked]="!a.unlocked">
          <div class="a-icon">{{a.unlocked ? a.icon : '🔒'}}</div>
          <div class="a-copy">
            <h3>{{a.name}}</h3>
            <p>{{a.description}}</p>
            <div class="progress"><i [style.width.%]="a.progress"></i></div>
            <small>{{a.progress}}{{'achievements.complete' | translate}}</small>
            <button *ngIf="a.unlocked && !isClaimed(a.key)" class="claim-btn" type="button" [disabled]="isWatchingAd === a.key" (click)="claim(a)">
              <ion-icon name="play-circle"></ion-icon>{{isWatchingAd === a.key ? ('common.adLoading' | translate) : ('achievements.claim' | translate) + ' 🪙' + rewardCoins}}
            </button>
            <small *ngIf="a.unlocked && isClaimed(a.key)" class="claimed-tag">🪙 {{'achievements.claimed' | translate}}</small>
          </div>
        </article>
      </section>
      <small class="ad-error" *ngIf="adErrorMessage">{{adErrorMessage}}</small>
      <nav class="bottom-nav">
        <button class="nav-item" (click)="go('/home')">
          <ion-icon name="home"></ion-icon>{{'common.home' | translate}}
        </button>
        <button class="nav-item" (click)="go('/game')">
          <ion-icon name="game-controller"></ion-icon>{{'common.play' | translate}}
        </button>
        <button class="nav-item active">
          <ion-icon name="trophy"></ion-icon>{{'achievements.title' | translate}}
        </button>
        <button class="nav-item" (click)="go('/profile')">
          <ion-icon name="person-circle"></ion-icon>{{'common.profile' | translate}}
        </button>
      </nav>
    </div>
  </main>
</ion-content>
